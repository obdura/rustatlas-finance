[package]
name = "rustatlas"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.37"
rayon = "1.7.0"
rand = "0.8.0"
thiserror = "1.0"
argmin = { version = "0.10" }
indicatif = "0.17.7"
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.68"
colored = "2.0"
nalgebra = "0.33.0"


[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
approx = "0.5"

[[bench]]
name = "fixedratepricing"
harness = false

[[example]]
name = "fixedratepricing"

[[example]]
name = "floatingratepricing"

