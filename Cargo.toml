[package]
name = "rustatlas"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.37"
rayon = "1.7.0"
thiserror = "2.0.12"
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.142"
colored = "3.0.0"
nalgebra = "0.34.0"

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
approx = "0.5"
argmin = { version = "0.10.0" }
indicatif = "0.18.0"
rand = "0.8.5"

[[bench]]
name = "fixedratepricing"
harness = false

[[example]]
name = "fixedratepricing"

[[example]]
name = "floatingratepricing"

