[package]
name = "rustatlas"
version = "1.0.2"
edition = "2021"
description = "High-performance quantitative finance library for fixed income, FX, swaps, and ALM simulation."
repository = "https://github.com/Poss9368/rustatlas-finance"
license = "MIT"
keywords = ["finance", "fixed-income", "alm", "quantitative", "derivatives"]
categories = ["finance", "mathematics", "simulation", "science"]
authors = ["RustAtlas Contributors"]
readme = "README.md"

[dependencies]
chrono = "0.4.37"
rayon = "1.7.0"
thiserror = "2.0.12"
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.142"
colored = "3.0.0"
nalgebra = "0.33.2"
bumpalo = "3.19.1"


[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
approx = "0.5"
argmin = { version = "0.10.0" }
indicatif = "0.18.0"
rand = "0.8.5"

[[bench]]
name = "fixedratepricing"
harness = false

[[example]]
name = "fixedratepricing"

[[example]]
name = "floatingratepricing"

[[example]]
name = "swappricing"

[[example]]
name = "fxforward"

[[example]]
name = "rolloversimulation"
